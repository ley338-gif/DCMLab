name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, mbstring, zip, bcmath
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: ./vendor/bin/pint --test
      - run: npm run check
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Prepare test env
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Build assets
        # Pest rendert Inertia-Seiten ueber @vite -- ohne echtes Manifest
        # schlaegt jeder Test fehl, der eine Seite mit einer inzwischen
        # geaenderten Komponente aufruft (siehe docs/adr/0004).
        run: npm run build
      - run: ./vendor/bin/pest
        env:
          # Explizit, nicht nur ueber phpunit.xml (docs/adr/0069): auf einem
          # frischen Runner ist das ohnehin schon der Fall, aber die Suite
          # soll bei jedem Aufrufweg dieselbe erkennbare Absicht zeigen.
          APP_ENV: testing

  content:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --no-interaction --prefer-dist --no-dev
      - run: cp .env.example .env && php artisan key:generate
      - name: content:validate
        run: php artisan content:validate
        env:
          CONTENT_PATH: ${{ github.workspace }}/content
      - name: content:build ist aktuell (Flag-Hashes, Abschnitt 5.2)
        # content:build ist idempotent -- ein Diff danach heisst, jemand hat
        # eine Node/einen Datensatz geaendert, ohne den Hash neu zu erzeugen.
        run: |
          php artisan content:build
          git diff --exit-code -- ../../content
        env:
          CONTENT_PATH: ${{ github.workspace }}/content

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: python -m pytest

  scenario-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scenario-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: python -m pytest

  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: python -m pytest

  datasets-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datasets/build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy generate.py
      - run: python -m pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # APP_KEY (ADR 0087) ist ein Pflichtwert fuer docker-compose.yml, damit
      # app/scheduler nie mit leerem oder je Container unterschiedlichem
      # Schluessel starten koennen -- `build` braucht keinen echten Wert (die
      # Umgebung wird nie ausgefuehrt), aber Compose interpoliert die gesamte
      # Datei auch fuer `build`, ein Platzhalter reicht hier also aus.
      - run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: docker compose -f infra/docker-compose.yml build
      # orthanc/toolbox sind keine Compose-Services (Abschnitt 6: der
      # Orchestrator startet sie dynamisch per Docker-Socket), muessen
      # deshalb hier extra gebaut werden, damit CI ihre Dockerfiles prueft.
      - run: docker build -t dcmlab/orthanc:latest containers/orthanc
      - run: docker build -f containers/toolbox/Dockerfile -t dcmlab/toolbox:latest .
