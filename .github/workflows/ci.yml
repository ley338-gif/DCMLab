name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, mbstring, zip, bcmath
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: ./vendor/bin/pint --test
      - run: npm run check
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Prepare test env
        run: |
          cp .env.example .env
          php artisan key:generate
      - run: ./vendor/bin/pest

  content:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --no-interaction --prefer-dist --no-dev
      - run: cp .env.example .env && php artisan key:generate
      - name: content:validate
        # Nicht blockierend: der Content hat bekannte, dokumentierte Luecken
        # (docs/content-todo.md), die Content-Autoren beheben, nicht der Build.
        # Sobald die Liste dort leer ist, hier continue-on-error entfernen.
        continue-on-error: true
        run: php artisan content:validate
        env:
          CONTENT_PATH: ${{ github.workspace }}/content

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: python -m pytest

  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: python -m pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml build
