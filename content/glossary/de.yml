# Fachbegriffe für die {{term:…}}-Tooltips.
# term und expansion sind in allen Sprachen identisch. Übersetzt wird nur short.

dicom:
  term: DICOM
  expansion: Digital Imaging and Communications in Medicine
  short: Gleichzeitig ein Dateiformat und ein Netzwerkprotokoll — deshalb die ständige Verwechslung.
  see_also: [dimse]
  lesson: "1.1"

instance:
  term: Instance
  expansion: SOP Instance
  short: Ein einzelnes DICOM-Objekt, meist ein Bild — vollständig, mit allem Kontext darin.
  see_also: [series, sop-instance-uid]
  lesson: "1.1"

study:
  term: Study
  expansion: Study
  short: Ein Untersuchungstermin, ein Auftrag. Die Ebene, auf der Menschen von "der Untersuchung" sprechen.
  see_also: [series, study-instance-uid]
  lesson: "1.2"

series:
  term: Series
  expansion: Series
  short: Eine Aufnahme oder eine Rekonstruktion daraus. Ein Scan erzeugt meist mehrere.
  see_also: [study, instance]
  lesson: "1.2"

patient-id:
  term: PatientID
  expansion: Patient ID (0010,0020)
  short: Der Identifikator des Patienten. Der Name ist es nicht.
  see_also: [study]
  lesson: "1.2"

tag:
  term: Tag
  expansion: Data Element Tag
  short: Die Adresse eines Werts, aus Group und Element — je vier Hexziffern.
  see_also: [vr, private-creator]
  lesson: "1.3"

vr:
  term: VR
  expansion: Value Representation
  short: Zwei-Buchstaben-Code, der sagt, welcher Art ein Wert ist und was er enthalten darf.
  see_also: [tag, value-multiplicity]
  lesson: "1.3"

value-multiplicity:
  term: VM
  expansion: Value Multiplicity
  short: Wie viele Einzelwerte in einem Tag stecken, getrennt durch Backslash.
  see_also: [vr]
  lesson: "1.3"

private-creator:
  term: Private Creator
  expansion: Private Creator
  short: Der Eintrag, der einen Block privater Tags einem Hersteller zuordnet. Ohne ihn sind sie bedeutungslos.
  see_also: [tag]
  lesson: "1.3"

uid:
  term: UID
  expansion: Unique Identifier
  short: Weltweit eindeutige Zeichenkette aus Ziffern und Punkten, höchstens 64 Zeichen.
  see_also: [study-instance-uid, sop-instance-uid, sop-class]
  lesson: "1.4"

study-instance-uid:
  term: Study Instance UID
  expansion: Study Instance UID (0020,000D)
  short: Der einzige Wert, der eine Untersuchung eindeutig identifiziert.
  see_also: [uid, study]
  lesson: "1.4"

sop-instance-uid:
  term: SOP Instance UID
  expansion: SOP Instance UID (0008,0018)
  short: Die Identität eines einzelnen Objekts. Zwei Objekte mit derselben UID sind dasselbe Objekt.
  see_also: [uid, instance]
  lesson: "1.4"

sop-class:
  term: SOP Class
  expansion: Service-Object Pair Class
  short: Der Objekttyp — etwa CT Image Storage. Wird beim Verbindungsaufbau einzeln ausgehandelt.
  see_also: [abstract-syntax, presentation-context]
  lesson: "1.5"

scu:
  term: SCU
  expansion: Service Class User
  short: Die Seite, die eine Anfrage stellt — wer anruft.
  see_also: [scp, association]
  lesson: "1.5"

scp:
  term: SCP
  expansion: Service Class Provider
  short: Die Seite, die den Dienst erbringt — wer abnimmt.
  see_also: [scu, association]
  lesson: "1.5"

ae-title:
  term: AE Title
  expansion: Application Entity Title
  short: Der Name, unter dem sich eine DICOM-Anwendung meldet. Höchstens 16 Zeichen, zeichengenau verglichen.
  see_also: [called-ae-title, calling-ae-title]
  lesson: "1.5"

called-ae-title:
  term: Called AE Title
  expansion: Called AE Title
  short: Der Name der Gegenstelle — wen ich sprechen möchte.
  see_also: [ae-title, calling-ae-title]
  lesson: "1.5"

calling-ae-title:
  term: Calling AE Title
  expansion: Calling AE Title
  short: Der eigene Name beim Verbindungsaufbau — wer ich bin.
  see_also: [ae-title, called-ae-title]
  lesson: "1.5"

c-echo:
  term: C-ECHO
  expansion: Verification Service
  short: Der Funktionstest. Baut eine vollständige Association auf — beweist aber nichts über Bildübertragung.
  see_also: [association, scu]
  lesson: "1.5"

c-store:
  term: C-STORE
  expansion: Storage Service
  short: Der Dienst, mit dem ein Objekt abgelegt wird. Kein Dateikopieren, sondern eine Anfrage.
  see_also: [dimse, scu]
  lesson: "1.1"

c-find:
  term: C-FIND
  expansion: Query/Retrieve Find Service
  short: Suche nach Studien, Serien oder Instanzen anhand von Matching-Keys — findet, überträgt aber nichts.
  see_also: [dimse, scu]
  lesson: "2.3"

c-move:
  term: C-MOVE
  expansion: Query/Retrieve Move Service
  short: Anforderung von Objekten, ausgeliefert über eine neue Verbindung — dabei drehen sich die Rollen um.
  see_also: [scu, scp]
  lesson: "1.5"

c-get:
  term: C-GET
  expansion: Query/Retrieve Get Service
  short: Anforderung von Objekten wie C-MOVE, aber ausgeliefert über dieselbe Association statt eine neue.
  see_also: [c-move, scu]
  lesson: "2.4"

dimse:
  term: DIMSE
  expansion: DICOM Message Service Element
  short: Die Familie der klassischen DICOM-Dienste — C-ECHO, C-STORE, C-FIND, C-MOVE und weitere.
  see_also: [c-store, c-echo]
  lesson: "1.1"

association:
  term: Association
  expansion: Association
  short: Die ausgehandelte Verbindung zwischen zwei DICOM-Anwendungen. Angenommen heißt nicht, dass etwas durchgeht.
  see_also: [presentation-context, max-pdu]
  lesson: "1.8"

presentation-context:
  term: Presentation Context
  expansion: Presentation Context
  short: Ein Angebot aus Objekttyp und Kodierungen. Jeder wird einzeln angenommen oder abgelehnt.
  see_also: [abstract-syntax, transfer-syntax, association]
  lesson: "1.8"

abstract-syntax:
  term: Abstract Syntax
  expansion: Abstract Syntax
  short: Das "was" eines Presentation Context — der Objekttyp, also die SOP Class.
  see_also: [presentation-context, sop-class]
  lesson: "1.8"

max-pdu:
  term: Max PDU
  expansion: Maximum PDU Length
  short: Die größte Datenmenge, die eine Seite am Stück entgegennimmt. Jede Richtung hat ihren eigenen Wert.
  see_also: [association]
  lesson: "1.8"

transfer-syntax:
  term: Transfer Syntax
  expansion: Transfer Syntax
  short: Legt Byte-Reihenfolge, VR-Kodierung und Kompression fest. Ohne gemeinsame geht nichts durch.
  see_also: [implicit-vr, explicit-vr, presentation-context]
  lesson: "1.7"

implicit-vr:
  term: Implicit VR
  expansion: Implicit VR Little Endian
  short: Kodierung ohne VR im Datenstrom — die verpflichtende Rückfallebene jeder DICOM-Anwendung.
  see_also: [transfer-syntax, explicit-vr]
  lesson: "1.7"

explicit-vr:
  term: Explicit VR
  expansion: Explicit VR Little Endian
  short: Kodierung mit VR im Datenstrom. Der Normalfall in Dateien und auf der Leitung.
  see_also: [transfer-syntax, implicit-vr]
  lesson: "1.7"

coercion:
  term: Coercion
  expansion: Coercion of Data Elements
  short: Das Archiv überschreibt ankommende Patientendaten aktiv gegen seinen Bestand — quittiert mit Status 0xB000.
  see_also: [patient-id, c-store]
  lesson: "4.6"

worklist:
  term: Modality Worklist
  expansion: Modality Worklist Information Model - FIND
  short: Eigenes Informationsmodell für geplante Untersuchungen — kein Query-Retrieve-Level wie STUDY/SERIES, sondern eine flache Liste geplanter Schritte.
  see_also: [c-find, dimse]
  lesson: "2.5"

mpps:
  term: MPPS
  expansion: Modality Performed Procedure Step
  short: Die Modalität meldet Beginn (N-CREATE) und Ende (N-SET) einer Untersuchung — unabhängig vom Bildtransfer selbst.
  see_also: [worklist, dimse]
  lesson: "2.6"

storage-commitment:
  term: Storage Commitment
  expansion: Storage Commitment Push Model
  short: Das Archiv bestätigt aktiv, ein Objekt dauerhaft übernommen zu haben — nicht nur „angekommen", sondern „gesichert".
  see_also: [c-store, dimse]
  lesson: "2.7"

dicomweb:
  term: DICOMweb
  expansion: DICOMweb (QIDO-RS, WADO-RS, STOW-RS)
  short: Dieselben Grunddienste wie DIMSE, aber als HTTP-REST-API — JSON statt DIMSE-PDUs.
  see_also: [dimse, c-find]
  lesson: "2.8"

iod:
  term: IOD
  expansion: Information Object Definition
  short: Der Bausatz aus Pflicht- und optionalen Modulen, der festlegt, woraus ein Objekttyp bestehen muss.
  see_also: [tag]
  lesson: "3.1"

photometric-interpretation:
  term: Photometric Interpretation
  expansion: Photometric Interpretation (0028,0004)
  short: Legt fest, wie Pixelbytes als Helligkeit oder Farbe zu lesen sind — z. B. MONOCHROME1, MONOCHROME2 oder RGB.
  see_also: [iod]
  lesson: "3.2"

hounsfield-unit:
  term: Hounsfield Unit
  expansion: Hounsfield Unit (HU)
  short: Die genormte, geräteunabhängige CT-Dichteskala — Luft ≈ -1000, Wasser = 0.
  see_also: [photometric-interpretation]
  lesson: "3.3"

enhanced-iod:
  term: Enhanced IOD
  expansion: Enhanced Information Object Definition
  short: Ein Multiframe-Objekt mit Shared- und Per-Frame Functional Groups Sequences statt einheitlicher Attribute pro Datei.
  see_also: [iod]
  lesson: "3.4"

structured-report:
  term: Structured Report
  expansion: Structured Report (SR)
  short: Ein DICOM-Objekt mit strukturiertem Text/Messwerten statt Pixeldaten, jede Aussage mit eigenem Code.
  see_also: [iod]
  lesson: "3.5"

key-object-selection:
  term: Key Object Selection
  expansion: Key Object Selection Document (KOS)
  short: Ein Verweis auf bereits vorhandene Objekte als „relevant" — ohne eigene Pixeldaten.
  see_also: [structured-report]
  lesson: "3.5"

presentation-state:
  term: Presentation State
  expansion: Grayscale Softcopy Presentation State (GSPS)
  short: Speichert, wie ein vorhandenes Bild dargestellt werden soll (Fensterung, Anmerkungen), ohne dessen Pixel zu verändern.
  see_also: [key-object-selection]
  lesson: "3.5"

specific-character-set:
  term: Specific Character Set
  expansion: Specific Character Set (0008,0005)
  short: Legt fest, in welcher Zeichenkodierung alle Textwerte eines Objekts stehen — ohne dieses Attribut gilt reines ASCII.
  see_also: [tag]
  lesson: "3.6"

scheduled-workflow:
  term: Scheduled Workflow
  expansion: IHE Radiology Scheduled Workflow (SWF.b)
  short: Bündelt Worklist-Abfrage, Bildtransfer und MPPS-Statusmeldungen zu einem benannten, prüfbaren Ablauf mit eigenen Transaktionsnummern (RAD-5, RAD-8, RAD-6/7).
  see_also: [worklist, mpps]
  lesson: "5.1"

patient-information-reconciliation:
  term: Patient Information Reconciliation
  expansion: Patient Information Reconciliation (PIR)
  short: Regelt, wie ein zunächst unbekannter oder falsch erfasster Patient (z. B. Notfall) nachträglich mit dem echten Patientenstamm zusammengeführt wird.
  see_also: [coercion]
  lesson: "5.1"

xds-i:
  term: XDS-I
  expansion: Cross-Enterprise Document Sharing for Imaging
  short: Teilt Bilder zwischen Einrichtungen über Registry/Repository statt direkter Archiv-zu-Archiv-Verbindung — das geteilte Manifest ist technisch ein Key Object Selection Document.
  see_also: [key-object-selection]
  lesson: "5.1"

conformance-statement:
  term: Conformance Statement
  expansion: DICOM Conformance Statement (PS3.2)
  short: Herstellerdokument, das für jede Application Entity angibt, welche SOP-Klassen, Rollen (SCU/SCP) und Transfer-Syntaxen sie unterstützt — sagt nichts über Performance oder Verhalten bei Kantenfällen.
  see_also: [sop-class, association]
  lesson: "5.2"

de-identification:
  term: De-Identification
  expansion: De-Identification (DICOM PS3.15 Annex E)
  short: Standardisierte Aktionscodes (D/Z/X/K/C/U) pro Attribut — legen fest, ob ein Wert durch einen Platzhalter ersetzt, geleert, entfernt, unverändert gelassen oder durch eine neue, aber gültige UID ersetzt wird.
  see_also: [encrypted-attributes]
  lesson: "5.4"

encrypted-attributes:
  term: Encrypted Attributes Data Set
  expansion: Encrypted Attributes Data Set (0400,0550 Modified Attributes Sequence)
  short: DICOMs eigener, standardisierter Mechanismus für Pseudonymisierung — die Originalwerte werden verschlüsselt im de-identifizierten Objekt selbst mitgeführt, statt in einer externen Tabelle.
  see_also: [de-identification]
  lesson: "5.4"

atna:
  term: ATNA
  expansion: Audit Trail and Node Authentication (IHE ITI-TF)
  short: IHE-Profil für echte Zugriffsprotokollierung — Knoten authentifizieren sich gegenseitig und senden strukturierte Audit-Nachrichten an ein zentrales Audit-Repository. Orthanc selbst implementiert das nicht eingebaut.
  see_also: [conformance-statement]
  lesson: "5.5"

netzsegmentierung:
  term: Netzsegmentierung
  expansion: Netzwerksegmentierung (VLAN-Isolation)
  short: Trennt Modalitäten/Archive in ein eigenes, von anderen Netzen abgeschottetes Segment — die verbreitetste Kompensation dafür, dass DICOM selbst kaum eingebaute Authentifizierung kennt.
  see_also: [association]
  lesson: "5.6"

hl7-v2:
  term: HL7 v2
  expansion: Health Level Seven Version 2
  short: Ereignisorientierter Nachrichtenstandard, über den klinische Systeme unter anderem Patienten-, Auftrags- und Befunddaten austauschen.
  see_also: [adt, ack, fhir]
  lesson: "7.1"

segment:
  term: Segment
  expansion: HL7 v2 Segment
  short: Eine Zeile einer HL7-v2-Nachricht, zum Beispiel MSH, PID, ORC, OBR oder OBX.
  see_also: [hl7-v2]
  lesson: "7.2"

adt:
  term: ADT
  expansion: Admit, Discharge, Transfer
  short: HL7-v2-Nachrichtenfamilie für Patientenstammdaten und Bewegungsereignisse.
  see_also: [patient-id, hl7-v2]
  lesson: "7.3"

ack:
  term: ACK
  expansion: Acknowledgement
  short: Antwort auf eine HL7-v2-Nachricht. Entscheidend ist nicht nur, dass ein ACK kam, sondern welcher Acknowledgement Code darin steht.
  see_also: [hl7-v2]
  lesson: "7.5"

mllp:
  term: MLLP
  expansion: Minimal Lower Layer Protocol
  short: Häufig verwendete TCP-Rahmung für HL7-v2-Nachrichten; Transport und fachliche Verarbeitung sind dabei zwei getrennte Ebenen.
  see_also: [hl7-v2, ack]
  lesson: "7.5"

fhir:
  term: FHIR
  expansion: Fast Healthcare Interoperability Resources
  short: Ressourcenbasierter HL7-Standard für strukturierte Gesundheitsdaten und APIs.
  see_also: [service-request, imaging-study, diagnostic-report]
  lesson: "8.1"

service-request:
  term: ServiceRequest
  expansion: FHIR ServiceRequest
  short: FHIR-Ressource für die Anforderung einer diagnostischen oder anderen medizinischen Leistung.
  see_also: [imaging-study, diagnostic-report]
  lesson: "8.2"

imaging-study:
  term: ImagingStudy
  expansion: FHIR ImagingStudy
  short: FHIR-Ressource mit Informationen über eine DICOM-Studie; die DICOM-Instanzen selbst liegen nicht in der Ressource.
  see_also: [dicomweb, diagnostic-report]
  lesson: "8.2"

diagnostic-report:
  term: DiagnosticReport
  expansion: FHIR DiagnosticReport
  short: FHIR-Ressource für Befund und Interpretation diagnostischer Untersuchungen.
  see_also: [service-request, imaging-study]
  lesson: "8.2"

qido-rs:
  term: QIDO-RS
  expansion: Query based on ID for DICOM Objects by RESTful Services
  short: DICOMweb-Suchdienst für Studien, Serien und Instanzen.
  see_also: [dicomweb, wado-rs]
  lesson: "8.3"

wado-rs:
  term: WADO-RS
  expansion: Web Access to DICOM Objects by RESTful Services
  short: DICOMweb-Abrufdienst für DICOM-Objekte und Darstellungen.
  see_also: [dicomweb, qido-rs]
  lesson: "8.3"

stow-rs:
  term: STOW-RS
  expansion: Store Over the Web by RESTful Services
  short: DICOMweb-Speicherdienst zum Übertragen von DICOM-Objekten per HTTP.
  see_also: [dicomweb]
  lesson: "8.3"

ihe:
  term: IHE
  expansion: Integrating the Healthcare Enterprise
  short: Profile und Transaktionen, die Standards wie DICOM und HL7 für konkrete klinische Workflows zusammenführen.
  see_also: [hl7-v2, dicom, dicomweb]
  lesson: "8.3"
