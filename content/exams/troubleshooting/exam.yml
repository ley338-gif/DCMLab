# schichtuebergreifende cross-Fragen sind. Keine der zehn Lektionen
# hatte quiz:-Daten in ihrer meta.yml -- der Pool ist komplett neu
# geschrieben. Antwortindizes 0-basiert (single/multi), siehe ADR 0066.

