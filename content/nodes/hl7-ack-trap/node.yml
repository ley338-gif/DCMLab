slug: hl7-ack-trap
difficulty: medium
points: 25
category: integration
themenfeld: interoperabilitaet
interaction: scenario
skills: [integration]
related_lessons: ["7.5"]
estimated_minutes: 8

scenario:
  start: ack
  steps:
    ack:
      prompt: >
        Die Interface Engine zeigt für MSG8821 den Status „ACK received“.
        Trotzdem wurde die Stammdatenänderung im RIS nicht übernommen.
        Das ACK enthält: MSA|AE|MSG8821|Patient identifier domain unknown.
        Wie bewertest du den Vorgang?
      options:
        - id: success
          label: Erfolgreich — ein ACK ist angekommen.
          next: wrong_ack
        - id: application_error
          label: Transport erfolgreich, fachliche Verarbeitung abgewiesen.
          next: inspect
    inspect:
      prompt: >
        Welcher Teil ist der stärkste direkte Hinweis auf den fachlichen Fehler?
      options:
        - id: message_type
          label: Der Nachrichtenname ACK.
          next: wrong_type
        - id: msa
          label: MSA-1 mit dem Wert AE.
          next: reprocessed

    reprocessed:
      prompt: >
        Richtig erkannt: MSA-1 = AE signalisiert einen Application Error. Die
        Identifier-Domäne wird korrigiert und dieselbe Nachricht MSG8821
        gezielt erneut verarbeitet. Die Interface Engine erhält jetzt:
        MSA|AA|MSG8821. Was kannst du daraus jetzt sicher schließen?
      options:
        - id: accepted_verify
          label: Die antwortende Anwendung hat die Nachricht gemäß ACK-Semantik erfolgreich verarbeitet; ob der gewünschte End-to-End-Zustand in allen beteiligten Systemen erreicht wurde, wird anschließend verifiziert.
          next: success
        - id: workflow_done
          label: Der komplette Workflow ist damit sicher erfolgreich abgeschlossen.
          next: wrong_overclaim
        - id: still_error
          label: Es bleibt ein Application Error, AA ändert daran nichts.
          next: wrong_misread

    wrong_ack:
      terminal: true
      outcome: wrong
      prompt: >
        Ein ACK ist nur die Antwort. Sein Inhalt entscheidet, ob akzeptiert,
        fehlerhaft verarbeitet oder abgewiesen wurde.
    wrong_type:
      terminal: true
      outcome: wrong
      prompt: >
        Dass die Antwort ein ACK ist, sagt noch nichts über Erfolg. Lies den
        Acknowledgement Code im MSA-Segment.
    wrong_overclaim:
      terminal: true
      outcome: wrong
      prompt: >
        AA bestätigt die erfolgreiche Verarbeitung dieser einen Nachricht
        durch das RIS — mehr als eine bloße Annahme. Es beweist aber nicht
        automatisch, dass der gewünschte End-to-End-Zustand (hier: die
        korrigierten Stammdaten in allen beteiligten Systemen) bereits
        erreicht ist; das prüfst du zusätzlich.
    wrong_misread:
      terminal: true
      outcome: wrong
      prompt: >
        AA steht für Application Accept, nicht für einen fortbestehenden
        Fehler. Das zweite ACK unterscheidet sich vom ersten.
    success:
      terminal: true
      outcome: correct
      reveal: AA-VERIFY-RIS
      prompt: >
        Richtig. MSA-1 = AA heißt: Die antwortende Anwendung hat die
        Nachricht gemäß ACK-Semantik erfolgreich verarbeitet — das ist eine
        echte, positive Aussage über diese Nachricht. Ob der gewünschte
        End-to-End-Zustand in allen beteiligten Systemen bereits erreicht
        ist, prüfst du trotzdem zusätzlich, bevor du den Vorgang als
        abgeschlossen betrachtest.

