slug: oru-status-gap
difficulty: hard
points: 50
category: integration
themenfeld: interoperabilitaet
interaction: scenario
skills: [integration]
related_lessons: ["7.2", "7.4", "7.5", "7.6"]
estimated_minutes: 20

scenario:
  start: ticket
  steps:
    ticket:
      prompt: >
        Im PACS ist die Study zu Patient 6620 (Study Instance UID
        1.2.276.0.7230010.3.1.4.556291043) vollständig vorhanden. Das
        Befundsystem/RIS zeigt zum Auftrag ORD-40118 einen korrigierten
        Befund (C, 11:47). Im KIS erscheint für denselben Auftrag weiterhin
        der vorherige finale Befund (F, 11:20). Im selben Log-Ausschnitt
        findet sich außerdem eine Ergebnisnachricht zu Patient 6631 /
        Auftrag ORD-40125.
      options:
        - id: resend_images
          label: Die Bildserie erneut vom PACS an den Viewer senden.
          next: wrong_resend
        - id: manual_patient_fix
          label: Den Patienten im KIS manuell korrigieren.
          next: wrong_manual_patient
        - id: overwrite_kis_text
          label: Den Befundtext direkt im KIS überschreiben.
          next: wrong_overwrite
        - id: correlate
          label: Erst die vorhandenen Ergebnisnachrichten korrekt den richtigen Aufträgen zuordnen.
          next: correlate

    correlate:
      prompt: >
        Im Log stehen drei Ergebnisnachrichten: RES60110 (OBR ORD-40118,
        OBX-11 F, 11:20), RES60119 (OBR ORD-40118, OBX-11 C, 11:47) und
        RES60122 (OBR ORD-40125, OBX-11 F, 11:31). Welche Nachrichten
        gehören zum gemeldeten Fall?
      options:
        - id: correct_pair
          label: RES60110 und RES60119 — beide zu ORD-40118 / Patient 6620.
          next: evidence
        - id: wrong_pair
          label: RES60119 und RES60122 — beide sind die zeitlich neuesten Nachrichten.
          next: wrong_correlation

    evidence:
      prompt: >
        Du sammelst getrennte Evidenz. RIS: RES60119 / ORD-40118 / Status C
        erzeugt, 11:47. Interface Engine inbound: RES60119 vorhanden, 11:47.
        Route RAD_RESULTS_TO_KIS: allowed_status = P,F. KIS outbound:
        RES60110 vorhanden (11:20), RES60119 fehlt. Zum Vergleich: RES60110
        (Final) → Outbound zu KIS: SENT, ACK: AA. RES60119 (Correction) →
        kein entsprechender Outbound-/ACK-Eintrag. Welche Aussage lässt sich
        aus dieser Evidenz am ehesten ableiten?
      options:
        - id: kis_rejected
          label: Das KIS hat die Correction empfangen, aber inhaltlich abgelehnt.
          next: wrong_kis_rejected
        - id: ris_internal_only
          label: Das RIS hat nur den internen Status geändert, ohne eine Result-Nachricht zu erzeugen.
          next: wrong_ris_internal
        - id: ack_covers_all
          label: Das AA-ACK für RES60110 bestätigt, dass auch die spätere Correction RES60119 verarbeitet wurde.
          next: wrong_ack_scope
        - id: route_filters_status
          label: Die Routing-Regel RAD_RESULTS_TO_KIS lässt nur die Status P und F passieren — C wird deshalb nicht weitergeleitet.
          next: boundary_confirm

    boundary_confirm:
      prompt: >
        allowed_status der Route RAD_RESULTS_TO_KIS enthält nur P und F,
        nicht C. Wo liegt damit die erste fehlerhafte Systemgrenze in dieser
        Kette?
      options:
        - id: confirm_boundary
          label: Zwischen Interface Engine und KIS, im Outbound-/Routing-Schritt für den Ergebnisstatus C.
          next: success
        - id: pacs_boundary
          label: Zwischen PACS und Befundsystem.
          next: wrong_pacs_boundary
        - id: ris_never_created
          label: Das RIS hat den korrigierten Befund nie erzeugt.
          next: wrong_ris_never

    wrong_resend:
      terminal: true
      outcome: wrong
      prompt: >
        Die Bilder sind bereits vollständig und korrekt im PACS. Ein
        erneuter Versand ändert nichts am Ergebnisweg, der hier gestört ist.
    wrong_manual_patient:
      terminal: true
      outcome: wrong
      prompt: >
        Es gibt keinen Hinweis auf ein Patientenidentitätsproblem. Eine
        manuelle Patientenkorrektur behebt die eigentliche Ursache nicht und
        kann neue Inkonsistenzen erzeugen.
    wrong_overwrite:
      terminal: true
      outcome: wrong
      prompt: >
        Den Befundtext direkt im KIS zu überschreiben umgeht die
        Ergebnisstrecke und hinterlässt keinen nachvollziehbaren Ursprung —
        die nächste reguläre Correction würde denselben Fehler erneut zeigen.
    wrong_correlation:
      terminal: true
      outcome: wrong
      prompt: >
        RES60122 gehört zu einem anderen Auftrag und Patienten. Zeitliche
        Nähe ist kein Korrelationskriterium — Order/Accession und Patient
        Identifier sind es.
    wrong_kis_rejected:
      terminal: true
      outcome: wrong
      prompt: >
        Es gibt keine Evidenz, dass die Nachricht das KIS überhaupt erreicht
        hat — im KIS-Outbound-Log fehlt RES60119 vollständig. Ein
        abgelehnter Import sähe anders aus als ein fehlender Eintrag. Der
        Fehler liegt davor.
    wrong_ris_internal:
      terminal: true
      outcome: wrong
      prompt: >
        Die Interface Engine bestätigt den Eingang von RES60119 — das RIS
        hat also tatsächlich eine Result-Nachricht erzeugt und versendet,
        nicht nur einen internen Status geändert.
    wrong_ack_scope:
      terminal: true
      outcome: wrong
      prompt: >
        Ein ACK bezieht sich immer nur auf die konkrete Nachricht, zu der es
        gehört. Das AA für RES60110 (Final) trifft keine Aussage über
        RES60119 (Correction) — dafür existiert hier gar kein ACK-Eintrag.
    wrong_pacs_boundary:
      terminal: true
      outcome: wrong
      prompt: >
        PACS und Befundsystem sind hier nicht betroffen: Die Study ist
        vollständig, und der finale Befund kam bereits im KIS an. Das
        Problem liegt in der Ergebnisstrecke danach.
    wrong_ris_never:
      terminal: true
      outcome: wrong
      prompt: >
        Das RIS zeigt die Correction bereits an — sie wurde dort erzeugt.
        Der Fehler liegt im Transport/Routing danach, nicht im RIS selbst.
    success:
      terminal: true
      outcome: correct
      reveal: C-STATUS-ROUTING-KIS
      prompt: >
        Richtig. Die Correction RES60119 wurde vom RIS erzeugt und erreichte
        die Interface Engine (Inbound bestätigt). Die Routing-Regel
        RAD_RESULTS_TO_KIS lässt aber nur die Status P und F passieren — C
        fehlt in allowed_status, deshalb blieb der Outbound-Transfer zum KIS
        aus. Das frühere AA-ACK für RES60110 bezieht sich ausschließlich auf
        den Final-Befund und sagt nichts über die spätere Correction aus.
        Bilder und ursprünglicher Final-Befund waren nie betroffen.

