environment:
  engine: simulated
  hosts:
    - name: workstation
      ip: 10.50.0.50
      role: shell
    - name: archive
      ip: 10.50.0.10
      services:
        - port: 104
          type: scp
          ae_title: KLINIK-ARCHIV
          accepts: [verification, study-root-find]
