      records:
        - patient_id: "MEYER, HANS"
          patient_name: "MEYER^HANS"
          study_uid: "1.2.276.0.7230010.3.1.4.318852901447"
          study_description: "MR Kopf nativ"
          study_date: "20260310"
          series:
            - series_uid: "1.2.276.0.7230010.3.1.3.318852901448"
              series_description: "T2 TSE tra"

  known_calling_aets: [DCMLAB-WS]

  tools: [findscu, dcmdump]

  files:
    - anmeldeliste.txt   # die Aufnahme-Notiz mit der falsch abgetippten Patient ID

  templates:
    - label_key: tpl.help
      command: "help"
    - label_key: tpl.find_wrong
      command: "findscu -S -k QueryRetrieveLevel=STUDY -k PatientID=MEYER,HANS -k StudyInstanceUID -k StudyDescription -aet DCMLAB-WS -aec KLINIK-ARCHIV 10.50.0.10 104"
    - label_key: tpl.find_wildcard
      command: "findscu -S -k QueryRetrieveLevel=STUDY -k PatientID=ZIEL_MUSTER -k StudyInstanceUID -k StudyDescription -aet DCMLAB-WS -aec KLINIK-ARCHIV 10.50.0.10 104"
  placeholders: [ZIEL_MUSTER]

