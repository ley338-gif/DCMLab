slug: anruf-am-empfang
difficulty: easy
points: 10
category: security
themenfeld: datenschutz
interaction: scenario
skills: [security]
related_lessons: ["6.1"]
estimated_minutes: 5

scenario:
  start: anruf
  steps:
    anruf:
      prompt: >
        Das Telefon an der Anmeldung klingelt. Eine Anruferin sagt: „Hallo,
        hier ist Frau Berger. Mein Vater, Herr Berger, liegt bei Ihnen auf
        Station 4. Können Sie mir sagen, was die Befunde von gestern ergeben
        haben?"
      options:
        - id: sofort_auskunft
          label: Die Befunde direkt am Telefon mitteilen.
          next: fehler_sofort
        - id: identitaet_pruefen
          label: Im KIS nachsehen, ob für sie eine Entbindung hinterlegt ist.
          next: rueckfrage
    rueckfrage:
      prompt: >
        Im KIS ist keine Entbindung hinterlegt. Die Anruferin klingt
        ungeduldig: „Ich bin doch seine Tochter, das muss doch reichen!"
      options:
        - id: trotzdem_auskunft
          label: Die Angaben trotzdem machen, es klingt ja plausibel.
          next: fehler_trotzdem
        - id: verweis_rueckruf
          label: Keine Auskunft am Telefon; den Patienten fragen und einen Rückruf ankündigen.
          next: erfolg
    fehler_sofort:
      terminal: true
      outcome: wrong
      prompt: >
        Verstoß gegen die Schweigepflicht (§ 203 StGB) und den Datenschutz
        (Art. 9 DSGVO): am Telefon lässt sich eine Identität nicht überprüfen,
        egal wie plausibel der Anruf klingt.
    fehler_trotzdem:
      terminal: true
      outcome: wrong
      prompt: >
        Auch unter Druck gilt: ohne dokumentierte Schweigepflichtentbindung
        keine Auskunft am Telefon — Ungeduld ist kein Ausweis.
    erfolg:
      terminal: true
      outcome: correct
      reveal: schweigepflicht-gewahrt
      prompt: >
        Richtig: ohne dokumentierte Entbindung gibt es keine Auskunft am
        Telefon. Den Patienten fragen, ob und wem er Auskunft geben möchte,
        und danach zurückrufen — an eine Nummer, die nicht von der Anruferin
        stammt, etwa die beim Patienten hinterlegte. Das wahrt die
        Schweigepflicht und hilft der Anruferin trotzdem.

