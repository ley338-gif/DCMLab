slug: hl7-order-gap
difficulty: medium
points: 25
category: integration
themenfeld: interoperabilitaet
interaction: scenario
skills: [integration]
related_lessons: ["7.4", "4.7"]
estimated_minutes: 12

scenario:
  start: ticket
  steps:
    ticket:
      prompt: >
        Am CT-9 fehlt der Patient 8842 in der Worklist. Andere Patienten
        erscheinen normal, eine allgemeine MWL-Abfrage an den Broker
        funktioniert. Im KIS ist der Auftrag ORD-77410 sichtbar und
        freigegeben.
      options:
        - id: device_reconfigure
          label: Den Scheduled Station AE Title am CT sofort ändern.
          next: wrong_device
        - id: trace_order
          label: Den Auftrag über Interface Engine und RIS anhand seiner IDs verfolgen.
          next: interface
        - id: manual_entry
          label: Den Patienten manuell am CT anlegen und das Ticket schließen.
          next: wrong_manual

    interface:
      prompt: >
        In der Interface Engine findest du den Eingang der Nachricht
        MSG55902 aus dem KIS, bestätigt um 09:12. Im
        Outbound-Transferprotokoll zum RIS existiert für dieselbe Nachricht
        kein Eintrag mit Status SENT — der letzte Eintrag zeigt
        State: ERROR. An welcher Systemgrenze ist der Auftrag zuerst
        verloren gegangen?
      options:
        - id: kis_ie
          label: Zwischen KIS und Interface Engine — die Nachricht ist nie angekommen.
          next: wrong_kis_ie
        - id: ie_ris
          label: Zwischen Interface Engine und RIS — der Outbound-Transfer ist fehlgeschlagen.
          next: mapping_detail
        - id: ris_mwl
          label: Zwischen RIS und MWL Provider — der Broker hat keinen Eintrag erzeugt.
          next: wrong_ris_mwl

    mapping_detail:
      prompt: >
        Der fehlgeschlagene Transfer-Log-Eintrag zeigt: Procedure code:
        CTA_EXT, Mapping: no target mapping, State: ERROR. Was ist die
        wahrscheinlichste Ursache?
      options:
        - id: confirm_mapping
          label: Für den Prozedurcode CTA_EXT existiert kein Ziel-Mapping zwischen Interface Engine und RIS.
          next: reprocess
        - id: network2
          label: Ein Netzwerkfehler zwischen Interface Engine und RIS.
          next: wrong_network
        - id: uid2
          label: Eine doppelt vergebene Study Instance UID.
          next: wrong_uid

    reprocess:
      prompt: >
        Nach Ergänzung des Ziel-Mappings für CTA_EXT wird der
        Outbound-Transfer gezielt erneut angestoßen. Das RIS legt danach
        den Auftrag ORD-77410 an, der Broker erzeugt einen MWL-Eintrag für
        CT-9. Welche Fehlerdomäne war ursächlich?
      options:
        - id: confirm_domain
          label: Auftrags-/Prozedurcode-Mapping zwischen Interface Engine und RIS.
          next: success

    wrong_device:
      terminal: true
      outcome: wrong
      prompt: >
        Die allgemeine MWL-Abfrage funktioniert. Ohne Beleg an der Gerätekonfiguration
        zu drehen würde einen neuen Fehler einführen, bevor die Auftragskette geprüft ist.
    wrong_manual:
      terminal: true
      outcome: wrong
      prompt: >
        Eine manuelle Eingabe umgeht den Fehler nur. Auftrag, Accession und spätere
        Zuordnung bleiben inkonsistent.
    wrong_kis_ie:
      terminal: true
      outcome: wrong
      prompt: >
        Der Eingang aus dem KIS ist im Interface-Engine-Log bereits bestätigt —
        die Nachricht ist dort angekommen. Der Fehler liegt danach.
    wrong_ris_mwl:
      terminal: true
      outcome: wrong
      prompt: >
        Ohne erfolgreichen Outbound-Transfer zum RIS kennt das RIS den Auftrag
        noch gar nicht. Der Broker kann dann folgerichtig keinen MWL-Eintrag
        erzeugen — das ist eine Folge, nicht die erste Fehlerstelle.
    wrong_network:
      terminal: true
      outcome: wrong
      prompt: >
        Der Log zeigt einen Mapping-Fehlerstatus für den Prozedurcode, keinen
        Verbindungsabbruch.
    wrong_uid:
      terminal: true
      outcome: wrong
      prompt: >
        Vor der Bildentstehung existiert noch keine Study Instance UID, an der
        dieser Auftrag scheitern könnte.
    success:
      terminal: true
      outcome: correct
      reveal: CTA-EXT-MAPPING
      prompt: >
        Richtig. Der Auftrag verschwand an der Grenze Interface Engine → RIS, weil der
        Prozedurcode CTA_EXT nicht gemappt war. Erst nach Korrektur und gezieltem
        Reprocessing konnte die MWL den Auftrag zeigen.

