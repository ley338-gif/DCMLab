slug: hl7-order-gap
difficulty: medium
points: 25
category: integration
themenfeld: interoperabilitaet
interaction: scenario
skills: [integration]
related_lessons: ["7.4", "4.7"]
estimated_minutes: 12

scenario:
  start: ticket
  steps:
    ticket:
      prompt: >
        CT-5 zeigt den Patienten 4711 nicht in der Worklist. Im KIS ist der
        Auftrag ORD93821 sichtbar. C-ECHO und eine allgemeine MWL-Abfrage zum
        Broker funktionieren.
      options:
        - id: device_reconfigure
          label: Den Scheduled Station AE Title am CT sofort ändern.
          next: wrong_device
        - id: trace_order
          label: Den Auftrag über Interface Engine und RIS anhand seiner IDs verfolgen.
          next: interface
        - id: manual_entry
          label: Den Patienten manuell am CT anlegen und das Ticket schließen.
          next: wrong_manual

    interface:
      prompt: >
        In der Interface Engine findest du MSG4711. Der RIS antwortete mit
        MSA|AE|MSG4711 und ERR ... OBR^4 ... Unknown procedure code CTTHX2.
        Was ist die wahrscheinlichste Ursache?
      options:
        - id: network
          label: DICOM-Netzwerkfehler zwischen CT und PACS.
          next: wrong_network
        - id: mapping
          label: Der Prozedurcode aus OBR-4 ist im RIS/Mapping nicht bekannt.
          next: mapping_found
        - id: uid
          label: Die Study Instance UID ist doppelt vergeben.
          next: wrong_uid

    mapping_found:
      prompt: >
        Das Mapping wird ergänzt und die fehlgeschlagene Nachricht gezielt
        erneut verarbeitet. Das RIS legt den Auftrag an und der Broker liefert
        ihn anschließend in der MWL. Welche Fehlerdomäne war ursächlich?
      options:
        - id: confirm_mapping
          label: Auftrags-/Prozedurcode-Mapping zwischen HL7-Schnittstelle und RIS.
          next: success

    wrong_device:
      terminal: true
      outcome: wrong
      prompt: >
        Die allgemeine MWL-Abfrage funktioniert. Ohne Beleg an der Gerätekonfiguration
        zu drehen würde einen neuen Fehler einführen, bevor die Auftragskette geprüft ist.
    wrong_manual:
      terminal: true
      outcome: wrong
      prompt: >
        Eine manuelle Eingabe umgeht den Fehler nur. Auftrag, Accession und spätere
        Zuordnung bleiben inkonsistent.
    wrong_network:
      terminal: true
      outcome: wrong
      prompt: >
        Der Auftrag ist bereits vor der DICOM-Worklist-Kette gescheitert: das RIS hat
        die HL7-Nachricht fachlich abgewiesen.
    wrong_uid:
      terminal: true
      outcome: wrong
      prompt: >
        Vor der Bildentstehung existiert noch keine Study Instance UID, an der dieser
        Auftrag scheitern könnte.
    success:
      terminal: true
      outcome: correct
      reveal: OBR-4-MAPPING
      prompt: >
        Richtig. Der Auftrag verschwand an der Grenze Interface Engine → RIS, weil der
        Prozedurcode aus OBR-4 nicht gemappt war. Erst nach Korrektur und gezieltem
        Reprocessing konnte die MWL den Auftrag zeigen.

