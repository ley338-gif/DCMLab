slug: silent-ct
difficulty: easy
points: 10
category: netzwerk
skills: [netzwerk]
related_lessons: ["1.5"] # "4.1" folgt, sobald Track 4 geschrieben ist (siehe docs/content-todo.md)
estimated_minutes: 15

environment:
  engine: simulated
  hosts:
    - name: workstation
      ip: 10.20.0.50
      role: shell
    - name: archive
      ip: 10.20.0.10
      services:
        - port: 104
          type: scp
          ae_title: PACS-ARCHIV
          accepts: [verification, ct-image-storage, study-root-find]
      config_visible: false        # AE Title gesperrt — Herstellerzugang
    - name: ct-console
      ip: 10.20.0.30
      role: modality-simulator
      config_editable: true
      config:
        local_ae: CT_RAUM3
        remote_ae: PACS_ARCHIV     # ← der eingebaute Fehler
        remote_host: 10.20.0.10
        remote_port: 104

  known_calling_aets: [DCMLAB-WS, CT_RAUM1, CT_RAUM3, MR_1, RIS-WL, VIEWER-01]

  tools: [echoscu, storescu, findscu, dcmdump]
  dataset: ct-thorax-3-slices

  files:
    - netzplan-radiologie.txt      # enthält den korrekten AE Title
    - notizen.txt                  # Wartungsprotokoll, Konfig aus Backup 02/2024
    - conformance-pacs-archiv.txt  # nennt beide Ablehnungsgründe, nicht den AE Title

  templates:
    - label_key: tpl.help
      command: "help"
    - label_key: tpl.ping
      command: "ping 10.20.0.10"
    - label_key: tpl.ls
      command: "ls"
    - label_key: tpl.echo
      command: "echoscu -aet DCMLAB-WS -aec ZIEL_AE 10.20.0.10 104"
    - label_key: tpl.find_study
      command: "findscu -S -k QueryRetrieveLevel=STUDY -k PatientID=4711 -k StudyInstanceUID -k StudyDescription -aet DCMLAB-WS -aec ZIEL_AE 10.20.0.10 104"
    - label_key: tpl.find_series
      command: "findscu -S -k QueryRetrieveLevel=SERIES -k StudyInstanceUID=UID_AUS_SCHRITT_1 -k SeriesDescription -aet DCMLAB-WS -aec ZIEL_AE 10.20.0.10 104"
  placeholders: [ZIEL_AE, UID_AUS_SCHRITT_1]

# Association-Prüfung, in dieser Reihenfolge:
#   1. Host unbekannt            -> TCP Initialization Error: Connection timed out
#   2. Host bekannt, falscher Port -> Connection refused
#   3. Called AE != PACS-ARCHIV  -> Called AE Title Not Recognized,  Ablehnzähler +1
#   4. Calling AE unbekannt      -> Calling AE Title Not Recognized, Ablehnzähler +1
#   5. sonst                     -> akzeptiert, Annahmezähler +1

flag:
  type: tag_value
  source_tag: "0008,103E"
  hash: "sha256:43fb115381aeca6b92bc701207edba03710a3c23d6a0bc336fbe8a295a852e8a"
  case_sensitive: false

hints:
  - id: h1
    cost: 1
  - id: h2
    cost: 2
  - id: h3
    cost: 4

stuck_timeout_minutes: 10

