slug: gefiltert
difficulty: hard
points: 50
category: integration
skills: [integration]
related_lessons: ["3.8"]
estimated_minutes: 20

# Phase-D-Prototyp fuer ADR 0120 (Advanced PACS Operations Sandbox): der
# erste interaction: terminal-Node, der eine echte automatische
# Routenauswertung (Phase B) ueber die read-only pacs-CLI (Phase C)
# untersuchbar macht, statt eine Routing-Root-Cause ueber einen
# Scenario-Entscheidungsbaum zu erzaehlen.
#
# Bewusste Abgrenzung zu `dosis-bleibt-liegen` (Lektion 3.7/3.8, dieselbe
# fachliche Fehlerklasse: eine PACS-Routingregel selektiert nach Modality
# und schliesst dadurch einen RDSR aus): jener Node ist `interaction:
# scenario` mit kuratierter Log-Evidenz in Multiple-Choice-Form, weil
# services/engine zum Zeitpunkt seiner Entstehung keine PACS-interne
# Routing-/Job-Simulation kannte. Seit ADR 0120 Phase A-C existiert genau
# diese Faehigkeit generisch (RuntimeObject/Presence, automatische
# Routenauswertung, Jobs, Events, `pacs`-CLI) -- dieser Node hier ist ein
# eigenstaendiger Fall (eigene Hosts, eigene Dateien, eigene Study, eigene
# Route-ID, eigener Loesungsweg), der beweist, dass Phase A-C fuer einen
# echten Hands-on-Lernfall bereits ausreichen. `dosis-bleibt-liegen` bleibt
# unveraendert bestehen; keine Migration.
environment:
  hosts:
    - name: workstation
      ip: 10.83.0.50
      role: shell

    - name: pacs
      ip: 10.83.0.10
      # Sendende Identitaet fuer die automatische Weiterleitung an
      # dose-scp (ADR 0120, 8.4) -- getrennt von der lernenden-editierbaren
      # config, weil sie nicht dem Lernenden gehoert, sondern dem PACS
      # selbst.
      dicom:
        calling_ae: PACS-ARCHIV
      services:
        - id: pacs-store
          port: 104
          ae_title: PACS-ARCHIV
          accepted_sop_classes:
            - "1.2.840.10008.5.1.4.1.1.2"        # CT Image Storage
            - "1.2.840.10008.5.1.4.1.1.88.67"    # X-Ray Radiation Dose SR Storage
      # Der Incident: diese Regel wurde eingerichtet, um CT-Bilder an ein
      # nachgelagertes System weiterzuleiten, selektiert dafuer aber nach
      # Modality statt nach SOP Class. Syntaktisch eine vollkommen gueltige
      # Route (der Validator prueft nur Schema/Referenzen, nie fachliche
      # Sinnhaftigkeit, ADR 0120 9.3) -- die falsche fachliche Auswahl IST
      # der Incident.
      routes:
        - id: PACS-TO-DOSE
          enabled: true
          destination:
            host: dose-scp
            service: dose-store
          match:
            modality: CT

    - name: dose-scp
      ip: 10.83.0.30
      # Reines Weiterleitungsziel, keine eigene Shell fuer den Lernenden in
      # diesem Lab (Betreiber-Review nach PR #170) -- config_visible: false
      # haelt die AE-Identitaet aus der Host-Uebersicht heraus, analog zum
      # "Herstellerzugang gesperrt"-Muster in halbe-sache.
      config_visible: false
      services:
        - id: dose-store
          port: 104
          ae_title: DOSE-SCP
          # dose-scp unterstuetzt beide SOP Classes korrekt (inkl. RDSR) --
          # der Incident ist "nie geroutet", nicht "am Ziel abgelehnt". Ein
          # zweiter, unabhaengiger Incident (Zielablehnung) waere ein
          # anderer Fall.
          accepted_sop_classes:
            - "1.2.840.10008.5.1.4.1.1.2"
            - "1.2.840.10008.5.1.4.1.1.88.67"

  known_calling_aets: [CT-KONSOLE, PACS-ARCHIV]

  tools: [storescu, pacs, dcmdump]

  # Drei CT-Schichten und ein automatisch mitgeneriertes RDSR derselben
  # Untersuchung -- realistisch klein, terminalfreundlich (Abschnitt 9).
  # RDSR traegt Modality = SR und die reale RDSR-SOP-Class-UID (PS3.6
  # Annex A, X-Ray Radiation Dose SR Storage) -- niemals Modality = CT.
  objects:
    - filename: "schicht-1.dcm"
      bytes: 262144
      sop_class: "1.2.840.10008.5.1.4.1.1.2"
      modality: CT
    - filename: "schicht-2.dcm"
      bytes: 262144
      sop_class: "1.2.840.10008.5.1.4.1.1.2"
      modality: CT
    - filename: "schicht-3.dcm"
      bytes: 262144
      sop_class: "1.2.840.10008.5.1.4.1.1.2"
      modality: CT
    - filename: "dose-report.dcm"
      bytes: 8192
      sop_class: "1.2.840.10008.5.1.4.1.1.88.67"
      modality: SR

  templates:
    - label_key: tpl.help
      command: "help"
    - label_key: tpl.ls
      command: "ls"
    - label_key: tpl.store_schicht_1
      command: "storescu -aet CT-KONSOLE -aec PACS-ARCHIV 10.83.0.10 104 schicht-1.dcm"
    - label_key: tpl.store_schicht_2
      command: "storescu -aet CT-KONSOLE -aec PACS-ARCHIV 10.83.0.10 104 schicht-2.dcm"
    - label_key: tpl.store_schicht_3
      command: "storescu -aet CT-KONSOLE -aec PACS-ARCHIV 10.83.0.10 104 schicht-3.dcm"
    - label_key: tpl.store_dose_report
      command: "storescu -aet CT-KONSOLE -aec PACS-ARCHIV 10.83.0.10 104 dose-report.dcm"
  placeholders: []

# Hands-on-Solve-Contract (Phase D.1, ADR 0120): der Flag-Wert allein
# reicht nicht mehr zum Loesen -- der Incident muss zusaetzlich
# tatsaechlich im Runtime-State nachweisbar sein (rules.check_flag()
# prueft beides gemeinsam). Grund: mit nur einer Route im ganzen Node war
# `PACS-TO-DOSE` allein durch `pacs routes`/`pacs route show` ohne jeden
# Ingest ablesbar (Betreiber-Realitaetscheck nach PR #170) -- der Flag
# blieb zwar richtig gewaehlt, aber der Solve-Mechanismus erzwang die
# eigentliche Untersuchung nicht. Der Diagnoseweg bleibt trotzdem frei:
# WELCHE pacs-Befehle der Lernende dafuer benutzt, ist nicht Teil dieses
# Vertrags, nur der am Ende tatsaechlich entstandene Zustand.
solve:
  requires:
    # RDSR existiert als eigenes RuntimeObject.
    - type: object_exists
      as: rdsr
      where:
        sop_class: "1.2.840.10008.5.1.4.1.1.88.67"
        modality: SR

    # RDSR ist tatsaechlich im PACS gespeichert -- der erste Hop ist
    # gelungen, das Objekt existiert nicht nur hypothetisch.
    - type: presence
      object: rdsr
      host: pacs
      present: true

    # RDSR hat das Dose-System nicht erreicht.
    - type: presence
      object: rdsr
      host: dose-scp
      present: false

    # Die Route wurde fuer GENAU dieses Objekt wirklich automatisch
    # ausgewertet und hat wegen der Modality nicht gematcht -- nicht nur
    # irgendein RDSR/Match-Miss irgendwo im State (Objekt-Korrelation
    # ueber den `rdsr`-Alias, siehe object_exists oben).
    - type: event_exists
      where:
        type: route.evaluated
        route_id: PACS-TO-DOSE
        object: rdsr
        matched: false
        field: modality
        operator: equals
        expected: CT
        actual: SR

    # Fuer den Dosisbericht ist deshalb nie ein Weiterleitungsauftrag
    # entstanden -- kein fehlgeschlagener Transfer, sondern gar keiner.
    - type: job_not_exists
      where:
        route_id: PACS-TO-DOSE
        object: rdsr

    # Positiver Kontrollpfad: mindestens ein CT-Bild wurde ueber dieselbe
    # Route tatsaechlich erfolgreich weitergeleitet -- beweist, dass Route
    # und Zielverbindung grundsaetzlich funktionieren und der Incident
    # wirklich die Objektselektion ist, nicht Konnektivitaet. Bewusst
    # "mindestens ein" statt "alle drei" CT-Bilder -- keine unnoetig
    # bruechige exakte Zaehlbedingung ohne didaktischen Mehrwert.
    - type: job_exists
      where:
        route_id: PACS-TO-DOSE
        status: sent

flag:
  # Runtime-spezifischer technischer Wert (die ID der fehlerhaft
  # selektierenden Weiterleitungsregel) statt "SR" -- Lektion 3.8 nennt
  # Modality=SR fuer RDSR bereits explizit, ein reiner Modality-Flag waere
  # ohne einen einzigen pacs-Befehl erratbar (Betreiber-Review nach PR
  # #170). "SR" bleibt die Evidenz auf dem Weg dorthin, nicht der Loesungsschluessel.
  type: exact
  hash: "sha256:2662e04d35a6848ec1da765724835b810d72254a9b2de0f933ed368277acbb30"
  case_sensitive: false

hints:
  - id: h1
    cost: 2
  - id: h2
    cost: 4
  - id: h3
    cost: 6

stuck_timeout_minutes: 20

