# Achievement-Definitionen (siehe docs/content-schema.md Abschnitt 12).
# AchievementSeeder schreibt diese Liste nach `achievement_definitions`.
#
# unlock_when (ADR 0071/0077, P10.74): deklaratives Ausloesekriterium,
# ausgewertet von App\Achievements\AchievementUnlockEvaluator gegen
# activity_progress, sobald eine Aktivitaet abgeschlossen wird -- ersetzt
# das frueher hier ignorierte, jetzt entfernte node.yml-Feld
# `achievements:` (siehe docs/offene-fragen.md fuer den Verweis auf die
# alte Fassung). sandbox-starter hat bewusst kein unlock_when: sein
# Ausloeser ("Spielwiese gestartet") ist kein Abschluss und passt damit
# nicht in activity_progress -- bleibt hartkodiert in SandboxController.

